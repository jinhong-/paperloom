name: Paperloom
slug: paperloom
version: 0.2.0
description: Self-hosted server for Paperloom e-paper photo frames
url: https://github.com/jinhong-/paperloom
startup: application
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:frame
panel_title: Paperloom
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direct Paperloom server access for e-paper frames
map:
  - type: data
    path: /data/paperloom
  - type: ssl
    read_only: true
environment:
  PAPERLOOM_HOST: 0.0.0.0
  PAPERLOOM_PORT: '8099'
  PAPERLOOM_DATA_DIR: /data/paperloom
  PAPERLOOM_LOG_LEVEL: info
  PAPERLOOM_TELEGRAM_POLL_INTERVAL: '3'
