name: Build Home Assistant app

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "hassio/**"
      - ".github/workflows/build-home-assistant-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          # GHCR package paths use the owner's account name exactly as it
          # appears in GitHub. The trailing hyphen is part of the owner
          # name and must not be treated as a path separator.
          owner="${IMAGE_OWNER}"
          echo "version=ghcr.io/${owner}/paperloom-${ARCH}:0.1.0" >> "$GITHUB_OUTPUT"
          echo "run=ghcr.io/${owner}/paperloom-${ARCH}:run-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hassio/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.run }}
          provenance: false
          labels: |
            org.opencontainers.image.title=Paperloom
            org.opencontainers.image.description=Self-hosted server for Paperloom e-paper photo frames
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.hass.type=app
            io.hass.name=Paperloom
            io.hass.description=Self-hosted server for Paperloom e-paper photo frames
            io.hass.version=0.1.0
            io.hass.arch=${{ matrix.arch }}
