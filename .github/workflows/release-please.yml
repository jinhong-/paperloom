name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The whole repository is released, not only the web application.
          #
          # The root package carries the repository's own release: the
          # changelog that says what changed, and the tag that goes with
          # it. The web application is released separately because its
          # version is what the add-on and the page report.
          #
          # The two move together, so the add-on's version is always the
          # version of the server inside it.
          path: .
